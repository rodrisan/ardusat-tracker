<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0" y="0" width="1360" height="620" fill="#ffffff"/><text x="30" y="38" font-size="22" text-anchor="start" fill="#111827" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >Pointing Geometry &amp; Drivetrain</text><text x="30" y="60" font-size="12" text-anchor="start" fill="#4b5563" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >N2YO returns azimuth/elevation for YOUR latitude/longitude/altitude — the rotator just has to reproduce those two angles</text><text x="230" y="100" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >A · Top view — azimuth</text><circle cx="230" cy="330" r="170" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><circle cx="230" cy="330" r="113.33333333333333" fill="none" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="234" y="229.66666666666669" font-size="10" text-anchor="start" fill="#94a3b8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >30°</text><circle cx="230" cy="330" r="56.666666666666664" fill="none" stroke="#cbd5e1" stroke-dasharray="4 4"/><text x="234" y="286.3333333333333" font-size="10" text-anchor="start" fill="#94a3b8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >60°</text><text x="234" y="173" font-size="10" text-anchor="start" fill="#94a3b8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >0° (horizon)</text><text x="230.0" y="142.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >N 0°</text><line x1="230.0" y1="160.0" x2="230.0" y2="170.0" stroke="#64748b" stroke-width="2"/><text x="422.0" y="334.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >E 90°</text><line x1="400.0" y1="330.0" x2="390.0" y2="330.0" stroke="#64748b" stroke-width="2"/><text x="230.00000000000003" y="526.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >S 180°</text><line x1="230.00000000000003" y1="500.0" x2="230.00000000000003" y2="490.0" stroke="#64748b" stroke-width="2"/><text x="38.0" y="334.00000000000006" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >W 270°</text><line x1="60.0" y1="330.00000000000006" x2="70.0" y2="330.00000000000006" stroke="#64748b" stroke-width="2"/><path d="M82.8,245.0 L96.6,238.3 L110.5,233.2 L124.3,229.7 L137.7,227.5 L150.7,226.7 L163.1,227.0 L174.8,228.3 L185.7,230.5 L195.8,233.4 L205.0,236.8 L213.4,240.5 L221.0,244.5 L227.9,248.6 L234.1,252.7 L239.7,256.6 L244.8,260.4 L249.6,263.9 L254.2,267.1 L258.6,270.0 L263.1,272.7 L267.6,275.3 L272.4,277.6 L277.5,280.0 L282.9,282.4 L288.7,284.9 L294.9,287.8 L301.6,291.1 L308.5,295.0 L315.8,299.6 L323.2,305.0 L330.8,311.3 L338.3,318.6 L345.7,327.0 L352.7,336.4 L359.1,347.0 L364.9,358.7 L369.7,371.4 L373.5,385.1 L376.1,399.7 L377.2,415.0" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><circle cx="82.8" cy="245.0" r="5" fill="#15803d"/><text x="74.77568135664544" y="237.0" font-size="11" text-anchor="end" fill="#15803d" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >AOS</text><circle cx="263.1" cy="272.7" r="5" fill="#15803d"/><text x="271.05555555555554" y="264.7460983053621" font-size="11" text-anchor="start" fill="#15803d" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >TCA</text><circle cx="377.2" cy="415.0" r="5" fill="#15803d"/><text x="385.22431864335465" y="406.9999999999999" font-size="11" text-anchor="start" fill="#15803d" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >LOS</text><line x1="230" y1="330" x2="263.05555555555554" y2="272.7460983053621" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4"/><path d="M230,292 A38,38 0 0,1 249.0,297.1" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arr)"/><line x1="230" y1="330" x2="230" y2="160" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="6 4"/><text x="224" y="286" font-size="12" text-anchor="end" fill="#1d4ed8" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >az</text><circle cx="230" cy="330" r="5" fill="#111827"/><text x="230" y="352" font-size="11" text-anchor="middle" fill="#111827" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >you</text><text x="230" y="545" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >Azimuth: clockwise from TRUE north (not magnetic)</text><text x="230" y="562" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >Centre = zenith (90°), edge = horizon (0°)</text><text x="640" y="100" font-size="15" text-anchor="middle" fill="#b45309" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >B · Side view — elevation</text><line x1="440" y1="470" x2="840" y2="470" stroke="#64748b" stroke-width="2"/><text x="830" y="488" font-size="11" text-anchor="end" fill="#64748b" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >horizon (0°)</text><rect x="508" y="360" width="24" height="110" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/><text x="502" y="420" font-size="11" text-anchor="end" fill="#4b5563" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >mast</text><circle cx="520" cy="360" r="9" fill="#fde68a" stroke="#b45309" stroke-width="2"/><line x1="470.8508773426605" y1="394.41458618106276" x2="683.8304088577984" y2="245.28471272979078" stroke="#111827" stroke-width="5"/><line x1="503.28555817883205" y1="344.84653720739743" x2="528.522921378278" y2="380.88922715611307" stroke="#111827" stroke-width="3"/><line x1="531.9558797289468" y1="324.7713619351108" x2="557.1932429283928" y2="360.81405188382644" stroke="#111827" stroke-width="3"/><line x1="560.6262012790614" y1="304.6961866628242" x2="585.8635644785074" y2="340.7388766115398" stroke="#111827" stroke-width="3"/><line x1="589.2965228291762" y1="284.62101139053755" x2="614.5338860286222" y2="320.6637013392532" stroke="#111827" stroke-width="3"/><line x1="617.9668443792909" y1="264.545836118251" x2="643.2042075787369" y2="300.5885260669666" stroke="#111827" stroke-width="3"/><line x1="683.8304088577984" y1="245.28471272979078" x2="757.5540928438077" y2="193.66283345819664" stroke="#15803d" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6 4"/><text x="761.6498530652526" y="184.7949512764414" font-size="12" text-anchor="start" fill="#15803d" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >to satellite</text><line x1="520" y1="360" x2="750" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M630,360 A110,110 0 0,0 610.1,296.9" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="640" y="330" font-size="13" text-anchor="start" fill="#b45309" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >el</text><text x="640" y="520" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >Elevation: 0° at horizon → 90° at zenith</text><text x="640" y="537" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >Firmware clamps to EL Min…EL Max (−5…90° default)</text><text x="640" y="554" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >PREPASS: az follows the sat toward the AOS bearing</text><text x="1085" y="100" font-size="15" text-anchor="middle" fill="#be185d" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >C · Drivetrain &amp; steps/degree</text><rect x="960" y="125" width="250" height="58" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2" /><text x="1085.0" y="147" font-size="14" text-anchor="middle" fill="#be185d" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >Stepper motor</text><text x="1085.0" y="166" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >200 full steps/rev (1.8°)</text><line x1="1085" y1="183" x2="1085" y2="207" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/><rect x="960" y="207" width="250" height="58" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2" /><text x="1085.0" y="229" font-size="14" text-anchor="middle" fill="#be185d" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >Driver microstepping</text><text x="1085.0" y="248" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >×16 (MS pins / TMC config)</text><line x1="1085" y1="265" x2="1085" y2="289" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/><rect x="960" y="289" width="250" height="58" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" /><text x="1085.0" y="311" font-size="14" text-anchor="middle" fill="#b45309" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >Mechanical reduction</text><text x="1085.0" y="330" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >e.g. 5:1 belt or 50:1 worm</text><line x1="1085" y1="347" x2="1085" y2="371" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/><rect x="960" y="371" width="250" height="58" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" /><text x="1085.0" y="393" font-size="14" text-anchor="middle" fill="#b45309" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >Antenna axis</text><text x="1085.0" y="412" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >Az 0–360° · El 0–90°</text><rect x="905" y="465" width="360" height="125" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" /><text x="1085" y="487" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >steps/deg = steps_rev × microsteps × ratio / 360</text><text x="1085" y="510" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >200 × 16 × 5 / 360 = 44.4  (belt 5:1)</text><text x="1085" y="530" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >200 × 16 × 50 / 360 = 444.4  (worm 50:1)</text><text x="1085" y="554" font-size="11.5" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Helvetica, Arial, sans-serif" >Firmware default = 10.0 → set it in TrackerConfig</text><text x="1085" y="574" font-size="11.5" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >°/s = steps/s ÷ steps/deg (firmware cap ≈ 1000 steps/s)</text></svg>