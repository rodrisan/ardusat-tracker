" >enabled · track</text><rect x="1002" y="290" width="146" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="1075.0" y="313" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >enabled · park</text><rect x="1152" y="290" width="166" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="1235.0" y="313" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >disabled</text><rect x="202" y="350" width="176" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="290.0" y="373" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >30 s</text><rect x="382" y="350" width="216" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="490.0" y="373" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >5 s</text><rect x="602" y="350" width="396" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="800.0" y="373" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >1 s *</text><rect x="1002" y="350" width="146" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="1075.0" y="373" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >30 s</text><rect x="1152" y="350" width="166" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="1235.0" y="373" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >30 s</text><rect x="202" y="410" width="176" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="290.0" y="433" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >300 s</text><rect x="382" y="410" width="216" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="490.0" y="433" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >60 s</text><rect x="602" y="410" width="396" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="800.0" y="433" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >60 s</text><rect x="1002" y="410" width="146" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="1075.0" y="433" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >300 s</text><rect x="1152" y="410" width="166" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" /><text x="1235.0" y="433" font-size="12" text-anchor="middle" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >300 s</text><text x="30" y="488" font-size="11.5" text-anchor="start" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >* A 10-minute pass at 1 s ≈ 600 /positions calls (limit 1000/h). Each HTTPS call blocks loop() for ~0.3–2 s, so real cadence is slower and motion pauses briefly.</text><text x="30" y="506" font-size="11.5" text-anchor="start" fill="#374151" font-weight="normal" font-family="Helvetica, Arial, sans-serif" >Antenna moves only when the target leaves the deadband (beamwidth × factor = 20° × 0.5 = 10° by default), at most every 800 ms per axis.</text></svg>